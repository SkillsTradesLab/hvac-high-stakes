<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Pool | HVAC High Stakes</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand">SKILLS TRADES LAB<b>Question Pool ♠</b></div><nav><a href="teacher.html">Teacher table</a><a href="guide.html">Rules</a></nav></header><main><div class="eyebrow">Teacher review · answer key included</div><h1>269 ways to play.</h1><p class="muted">Original practice questions based on the supplied chapters. Includes 70 numerical forms with varied values. Review the keys and explanations before class.</p><div class="row"><input id="search" aria-label="Search questions" placeholder="Search a topic, question, or explanation"><select id="chapter" aria-label="Chapter"><option value="">All chapters</option><option value="1">Chapter 1</option><option value="5">Chapter 5</option><option value="8">Chapter 8</option></select><select id="level" aria-label="Skill level"><option value="">All skills</option><option>Basic</option><option>Applied</option><option>Advanced</option></select></div><p id="count"></p><div id="pool"></div></main><script src="bank.js"></script><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){let term=document.querySelector('#search').value.toLowerCase(),ch=document.querySelector('#chapter').value,lv=document.querySelector('#level').value,qs=QUESTION_BANK.filter(q=>(!ch||q.chapter==ch)&&(!lv||q.level===lv)&&JSON.stringify(q).toLowerCase().includes(term));document.querySelector('#count').textContent=qs.length+' questions';document.querySelector('#pool').innerHTML=qs.map(q=>`<details class="panel" style="margin-bottom:12px"><summary>${esc(q.id)} · ${q.level} · ${esc(q.prompt)}</summary><ol type="A">${q.choices.map((c,i)=>`<li>${esc(c)}${i===q.answer?' <b style="color:var(--gold)">✓ Correct</b>':''}</li>`).join('')}</ol><p>${esc(q.explanation)}</p><small>${esc(q.source)}</small></details>`).join('');}document.querySelectorAll('input,select').forEach(x=>x.oninput=draw);draw();
</script></body></html>
